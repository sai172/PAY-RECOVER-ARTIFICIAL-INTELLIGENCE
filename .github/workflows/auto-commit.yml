name: GitHub Auto Commit

on:
  schedule:
    # Auto-generated schedules (UTC) representing active hours window
    - cron: '32 6 * * *'
    - cron: '49 14 * * *'
    - cron: '15 22 * * *'
  workflow_dispatch: # Allows manual trigger from Actions UI

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Random Delay
        run: |
          # Sleep a random number of seconds (up to 90 minutes / 5400 seconds)
          DELAY=$((RANDOM % 5400))
          echo "Delaying execution by $DELAY seconds..."
          sleep $DELAY

      - name: Update Activity Log
        run: |
          echo "Auto-commit: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> activity-log.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "auto-commit-bot@users.noreply.github.com"
          git config --local user.name "GitHub Auto-Commit Bot"
          git add activity-log.txt
          
          # Preset messages list (20 varied messages)
          MESSAGES=(
            "chore: update activity log"
            "refactor: minor cleanup"
            "docs: update notes"
            "fix: formatting"
            "style: whitespace"
            "chore: routine maintenance"
            "perf: log optimization"
            "docs: sync notes"
            "chore: timestamp update"
            "build: routine check"
            "refactor: code cleanup"
            "docs: update documentation"
            "fix: minor bugfix"
            "chore: log rotation"
            "style: code style update"
            "perf: enhance performance"
            "build: minor updates"
            "chore: sync tracking log"
            "docs: update readme logs"
            "refactor: optimize imports"
          )
          
          # Pick a random message
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          
          git commit -m "$RANDOM_MSG"
          
          # Push using PAT stored in AUTO_COMMIT_PAT repository secret
          git push https://x-access-token:${{ secrets.AUTO_COMMIT_PAT }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
